[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genomevault"
version = "0.1.0"
description = "Passphrase-based encryption for genomic files. Wraps the GA4GH Crypt4GH standard with deterministic keypair derivation so users never manage key files."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Daniel Thiberge", email = "github@dant123.com" },
]
requires-python = ">=3.10"
keywords = ["genomics", "encryption", "crypt4gh", "vcf", "fastq", "bam", "bioinformatics", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=42.0",
    "crypt4gh>=1.7",
    "pynacl>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
genomevault = "genomevault.cli:main"

[project.urls]
Homepage = "https://github.com/danthi123/genomevault"
Repository = "https://github.com/danthi123/genomevault"
Issues = "https://github.com/danthi123/genomevault/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
genomevault = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "S",    # bandit (security)
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # assert statements (fine in tests)
    "S603",  # subprocess calls (fine in CLI tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
